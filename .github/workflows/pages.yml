# Publishes the Sphinx app to GitHub Pages on every push to main.
# Replaces GitHub's built-in "pages build and deployment", whose deploy step gives up after 10 minutes.
name: Publish Sphinx

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes can't find the just-uploaded artifact for a few seconds ("No artifacts named github-pages"):
      # try once, wait, then try again instead of failing the whole publish.
      - id: deploy_try
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
